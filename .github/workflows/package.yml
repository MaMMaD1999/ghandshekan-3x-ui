name: GhandShekan packages
on:
  workflow_dispatch:
  push:
    tags: ['v*-pronet.*', 'v*-ghandshekan.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/test_installer_menu.py
      - run: python3 tools/test_pronet_update.py
      - run: python3 tools/test_docker_runtime.py && python3 tools/test_pronet_update_slow.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci && npm run build && npm run typecheck && npm run test -- src/test/panel-version.test.ts src/test/pronet-traffic-cards.test.tsx
        working-directory: frontend
      - run: python3 tools/test_country_font_build.py
      - run: go test ./internal/xray ./internal/database ./internal/database/model ./internal/util/version ./internal/web/service ./internal/web/service/panel ./internal/web/runtime ./internal/web/job ./internal/web/controller ./internal/sub
      # Panel-only builds reuse the verified core from the previous release.
      # Both archives contain the core built from ed08d8db5a57e205129966c707b014bc6b172ed7.
      - name: Get the pinned custom core
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="x-ui-linux-$ARCH.tar.gz"
          gh release download v3.10.2-ghandshekan.33 --pattern "$archive"
          case "$ARCH" in
            amd64) expected=889f7fb2bda9eb07d171457069c314f5fe0bc452e979e4d28bc33e6eca9afc7b ;;
            arm64) expected=24e510e78214c827e8ae0ad62c9cafa80865d9a1c5d30b79115e9d054b6668b4 ;;
          esac
          echo "$expected  $archive" | sha256sum -c -
          member=$(tar -tzf "$archive" | grep -Ex "(\./)?x-ui/bin/xray-linux-$ARCH")
          tar -xOzf "$archive" "$member" > custom-xray
          chmod +x custom-xray
          rm "$archive"
      - run: python3 tools/test_pronet_core.py ./custom-xray
      - name: Build and verify package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          CC=musl-gcc CGO_ENABLED=1 go build -trimpath -ldflags='-s -w -linkmode external -extldflags -static' -o custom-panel .
          mkdir package
          cd package
          base=https://github.com/MHSanaei/3x-ui/releases/download/v3.10.2
          curl -fL --retry 3 "$base/x-ui-linux-$ARCH.tar.gz" -o upstream.tar.gz
          curl -fL --retry 3 "$base/x-ui-linux-$ARCH.tar.gz.sha256" -o upstream.sha256
          expected=$(awk '{print $1}' upstream.sha256)
          echo "$expected  upstream.tar.gz" | sha256sum -c -
          tar -xzf upstream.tar.gz
          cp ../custom-panel x-ui/x-ui
          cp ../custom-xray "x-ui/bin/xray-linux-$ARCH"
          cp ../x-ui.sh x-ui/x-ui.sh
          cp ../pronet-docker-runtime.sh ../DockerEntrypoint.sh x-ui/
          chmod +x x-ui/pronet-docker-runtime.sh x-ui/DockerEntrypoint.sh
          chmod +x x-ui/x-ui x-ui/x-ui.sh "x-ui/bin/xray-linux-$ARCH"
          ./x-ui/x-ui -v
          "./x-ui/bin/xray-linux-$ARCH" version
          bash -n ../pronet-install.sh ../pronet-cli.sh ../x-ui.sh ../pronet-update.sh
          tar -czf "../x-ui-linux-$ARCH.tar.gz" x-ui
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.arch }}
          path: x-ui-linux-*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - run: cd release && sha256sum x-ui-linux-*.tar.gz > checksums.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* pronet-install.sh ghandshekan-install.sh --prerelease --title "GhandShekan custom accounting $GITHUB_REF_NAME" --notes-file GHANDSHEKAN-RELEASE.md
