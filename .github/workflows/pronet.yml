name: GhandShekan validation
on:
  push:
    branches: [main, pronet/main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/test_installer_menu.py && python3 tools/test_pronet_update.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run typecheck
        working-directory: frontend
      - run: python3 tools/test_country_font_build.py
      - run: go test ./internal/xray ./internal/database/model ./internal/web/service ./internal/web/runtime ./internal/web/job ./internal/web/controller ./internal/sub
      - run: go build -o /tmp/pronet-panel .
      - uses: actions/upload-artifact@v7
        with:
          name: validated-linux-amd64-panel
          path: /tmp/pronet-panel
